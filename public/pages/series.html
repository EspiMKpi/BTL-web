<div id="page-series" class="page-content" x-data="seriesPage">
    <section class="catalog-hero catalog-hero-series">
        <div>
            <p class="landing-eyebrow">Series</p>
            <h1 class="catalog-title">Binge-Worthy Starts Here.</h1>
            <p class="catalog-copy">From limited thrillers to long-running universes, jump into stories built for late-night marathons.</p>
        </div>
        <div class="catalog-hero-metrics">
            <div class="catalog-metric">
                <span x-text="rails.reduce((s, r) => s + r.items.length, 0) || '...'">...</span>
                <p>TV series</p>
            </div>
            <div class="catalog-metric">
                <span>4K</span>
                <p>Stream quality</p>
            </div>
            <div class="catalog-metric">
                <span>7</span>
                <p>New weekly releases</p>
            </div>
        </div>
    </section>

    <!-- Loading -->
    <div x-show="loading" style="text-align:center; padding: 60px; color: rgba(255,255,255,0.5);">Loading...</div>
    <!-- Error -->
    <div x-show="error && !loading" style="text-align:center; padding: 40px; color: #ff6b6b;" x-text="error"></div>

    <!-- Rails -->
    <div x-show="!loading">
        <template x-for="rail in rails" :key="rail.id">
            <section class="movie-section">
                <div class="section-header">
                    <h2 class="section-title" x-text="rail.title"></h2>
                </div>
                <div class="movie-grid series-grid">
                    <template x-for="item in rail.items" :key="item.tmdb_id">
                        <div class="movie-card"
                             :data-tmdb-id="item.tmdb_id"
                             data-content-type="series"
                             @click="navigateTo(item)">
                            <div class="poster-container">
                                <img :src="posterUrl(item.poster_path)" :alt="item.name" loading="lazy">
                                <span class="rating-badge" x-text="item.vote_average ? item.vote_average.toFixed(1) : 'N/A'"></span>
                                <div class="bookmark-btn">
                                    <div class="icon-wrapper" style="width: 14px; height: 14px;">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                                    </div>
                                </div>
                            </div>
                            <div class="card-info">
                                <span class="card-title" x-text="item.name || item.title"></span>
                                <span class="card-status" x-text="item.first_air_date ? item.first_air_date.substring(0,4) : ''"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </section>
        </template>
        <div x-show="!loading && rails.length === 0 && !error" style="text-align:center; padding:60px; color:rgba(255,255,255,0.4);">
            No series available yet.
        </div>
    </div>
</div>
