<div id="page-detail" class="page-content" x-data="detailPage">
    <!-- Loading overlay -->
    <div x-show="loading" style="display:flex; align-items:center; justify-content:center; min-height:60vh; color:rgba(255,255,255,0.5);">
        Loading...
    </div>
    <!-- Error state -->
    <div x-show="error && !loading" style="text-align:center; padding:60px 20px; color:#ff6b6b;" x-text="error"></div>

    <div x-show="content && !loading">
        <section class="detail-hero">
            <div class="detail-hero-poster">
                <img :src="backdropUrl" :alt="title">
            </div>

            <div class="detail-hero-scrim"></div>
            <div class="detail-hero-content">
                <p class="landing-eyebrow" x-text="contentType === 'series' ? 'TV Series' : 'Movie'">Movie</p>
                <h1 class="detail-title" x-text="title">—</h1>
                <div class="detail-meta-row">
                    <span class="rating">★ <span x-text="content?.vote_average ? content.vote_average.toFixed(1) : 'N/A'"></span></span>
                    <span x-text="year"></span>
                    <span x-text="runtime"></span>
                    <span x-text="genreString"></span>
                </div>
                <p class="detail-desc" x-text="content?.overview">—</p>
                <div class="detail-cta-row">
                    <button class="btn btn-primary" id="btn-watch-now">
                        <div class="icon-wrapper" style="width: 18px; height: 18px; color: black;">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="m7 3 14 9-14 9V3z"/></svg>
                        </div>
                        Watch Now
                    </button>
                    <button class="btn btn-secondary" @click="toggleBookmark()"
                            :style="watchlistItem ? 'background: var(--accent-gold); color: black;' : ''">
                        <div class="icon-wrapper" style="width: 18px; height: 18px;">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                        </div>
                        <span x-text="watchlistItem ? 'In Watchlist' : 'Add to List'">Add to List</span>
                    </button>
                </div>
            </div>
        </section>

        <section class="detail-info-grid">
            <article class="detail-info-card">
                <p class="sidebar-label">Synopsis</p>
                <p x-text="content?.overview || '—'">—</p>
            </article>
            <article class="detail-info-card">
                <p class="sidebar-label">Cast</p>
                <p x-text="castString">—</p>
            </article>
            <article class="detail-info-card">
                <p class="sidebar-label">Genres</p>
                <p x-text="genreString">—</p>
            </article>
        </section>

        <!-- Episodes section — only for series -->
        <section class="episode-section" x-show="contentType === 'series' && content?.seasons && content.seasons.length > 0">
            <div class="section-header">
                <h2 class="section-title">Episodes</h2>
            </div>
            <div class="season-tabs">
                <template x-for="(season, idx) in (content?.seasons || [])" :key="idx">
                    <button class="season-tab"
                            :class="{ active: selectedSeason === idx }"
                            @click="selectedSeason = idx"
                            x-text="season.name || ('Season ' + (idx + 1))"></button>
                </template>
            </div>
            <div class="episode-grid">
                <template x-for="ep in currentSeasonEpisodes" :key="ep.episode_number">
                    <div class="episode-card">
                        <div class="ep-thumbnail">
                            <img :src="ep.still_path ? 'https://image.tmdb.org/t/p/w300' + ep.still_path : 'https://placehold.co/400x225/1a1a2e/white?text=No+Image'" :alt="ep.name" loading="lazy">
                            <div class="ep-number" x-text="ep.episode_number"></div>
                        </div>
                        <div class="ep-info">
                            <h3 x-text="ep.name">—</h3>
                            <p x-text="ep.overview || 'No description available.'">—</p>
                        </div>
                    </div>
                </template>
                <div x-show="currentSeasonEpisodes.length === 0" style="color:rgba(255,255,255,0.4); padding:20px;">
                    No episodes available.
                </div>
            </div>
        </section>
    </div>
</div>
