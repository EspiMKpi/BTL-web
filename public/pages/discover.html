<div id="page-discover" class="page-content nf-landing" x-data="discoverPage">
    <!-- Hero Carousel -->
    <section class="hero-carousel"
             @mouseenter="carouselPause()" @mouseleave="carouselResume()"
             @keydown.arrow-left.window="carouselPrev()" @keydown.arrow-right.window="carouselNext()">
        <template x-for="(slide, i) in heroSlides" :key="slide.tmdb_id">
            <div class="hero-slide" :class="{ 'active': carouselIndex === i }">
                <img :src="slide.backdropUrl" :alt="slide.title" class="hero-slide-bg">
                <div class="hero-slide-scrim"></div>
            </div>
        </template>

        <div class="hero-slide-content" x-show="currentSlide">
            <p class="hero-slide-kicker">
                <span class="hero-slide-type" x-text="currentSlide?._type === 'series' ? 'Series' : 'Movie'"></span>
                <span class="hero-slide-dot">·</span>
                <span x-text="currentSlide?.year"></span>
                <span class="hero-slide-dot">·</span>
                <span class="hero-slide-rating">★ <span x-text="currentSlide ? (currentSlide.vote_average || 0).toFixed(1) : ''"></span></span>
            </p>
            <h1 class="hero-slide-title" x-text="currentSlide?.title"></h1>
            <p class="hero-slide-desc" x-text="currentSlide?.overview ? (currentSlide.overview.length > 180 ? currentSlide.overview.substring(0, 180) + '…' : currentSlide.overview) : ''"></p>
            <div class="hero-slide-btns">
                <button class="btn btn-primary" type="button" @click="navigateTo(currentSlide, currentSlide?._type)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="m7 3 14 9-14 9V3z"/></svg>
                    Play Now
                </button>
                <button class="btn btn-secondary" type="button" @click="navigateTo(currentSlide, currentSlide?._type)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                    More Info
                </button>
            </div>
        </div>

        <!-- Carousel Nav Arrows -->
        <button class="hero-carousel-arrow hero-carousel-arrow-left" type="button" @click.stop="carouselPrev()" aria-label="Previous slide">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="hero-carousel-arrow hero-carousel-arrow-right" type="button" @click.stop="carouselNext()" aria-label="Next slide">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <!-- Dot Indicators -->
        <div class="hero-carousel-dots">
            <template x-for="(slide, i) in heroSlides" :key="'dot-'+slide.tmdb_id">
                <button class="hero-carousel-dot" :class="{ 'active': carouselIndex === i }" @click.stop="carouselGo(i)" :aria-label="'Go to slide ' + (i + 1)"></button>
            </template>
        </div>
    </section>

    <!-- Skeleton Loading State -->
    <template x-if="loading">
        <div>
            <div class="skeleton skeleton-hero" style="margin-bottom: 32px;"></div>
            <div>
                <div class="skeleton skeleton-text" style="width: 200px; height: 20px; margin-bottom: 16px;"></div>
                <div style="display: flex; gap: 14px; overflow: hidden;">
                    <div class="skeleton-card" style="min-width: 180px;"><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-short"></div></div>
                    <div class="skeleton-card" style="min-width: 180px;"><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-short"></div></div>
                    <div class="skeleton-card" style="min-width: 180px;"><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-short"></div></div>
                    <div class="skeleton-card" style="min-width: 180px;"><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-short"></div></div>
                    <div class="skeleton-card" style="min-width: 180px;"><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-short"></div></div>
                </div>
            </div>
        </div>
    </template>

    <div class="nf-error" x-show="error" x-text="error" style="text-align:center; padding: 40px 20px; color: #ff6b6b;"></div>

    <!-- Top 10 Rail -->
    <section class="movie-section nf-content-section" x-show="!loading && top10.length > 0">
        <div class="section-header">
            <h2 class="section-title" x-text="top10Rail ? top10Rail.title : 'Top 10 Today'">Top 10 Today</h2>
            <button class="see-all" type="button" @click="switchPage('movies')">Browse all</button>
        </div>
        <div class="content-rail-wrapper" x-data="scrollRail">
            <div class="rail-scroll-container">
                <button class="rail-arrow rail-arrow-left" :class="{ 'rail-arrow-visible': canScrollLeft }" @click="scrollLeft()" type="button" aria-label="Scroll left">
                    <span class="rail-arrow-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></span>
                </button>
                <div class="nf-top10-grid" x-ref="scrollContainer" @scroll="checkArrows()">
                    <template x-for="(item, index) in top10" :key="item.tmdb_id">
                        <article class="nf-top10-item">
                            <span class="nf-rank" x-text="index + 1"></span>
                            <div class="movie-card"
                                 :data-tmdb-id="item.tmdb_id"
                                 :data-content-type="top10ContentType"
                                 @click="navigateTo(item, top10ContentType)">
                                <div class="poster-container">
                                    <img :src="posterUrl(item.poster_path)" :alt="getTitle(item, top10ContentType)" loading="lazy">
                                    <span class="rating-badge" x-text="(item.vote_average || 0).toFixed(1)"></span>
                                </div>
                                <div class="card-info">
                                    <span class="card-title" x-text="getTitle(item, top10ContentType)"></span>
                                    <span class="card-status" x-text="getYear(item, top10ContentType) || (top10ContentType === 'series' ? 'Series' : 'Movie')"></span>
                                </div>
                            </div>
                        </article>
                    </template>
                </div>
                <button class="rail-arrow rail-arrow-right" :class="{ 'rail-arrow-visible': canScrollRight }" @click="scrollRight()" type="button" aria-label="Scroll right">
                    <span class="rail-arrow-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
                </button>
            </div>
        </div>
    </section>

    <!-- Trending / Genre Rails -->
    <template x-for="rail in otherRails" :key="rail.id">
        <section class="movie-section nf-content-section">
            <div class="section-header">
                <h2 class="section-title" x-text="rail.title"></h2>
                <button class="see-all" type="button" @click="switchPage(rail.content_type === 'series' ? 'series' : 'movies')">See all</button>
            </div>
            <div class="content-rail-wrapper" x-data="scrollRail">
                <div class="rail-scroll-container">
                    <button class="rail-arrow rail-arrow-left" :class="{ 'rail-arrow-visible': canScrollLeft }" @click="scrollLeft()" type="button" aria-label="Scroll left">
                        <span class="rail-arrow-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></span>
                    </button>
                    <div class="nf-row-grid" x-ref="scrollContainer" @scroll="checkArrows()">
                        <template x-for="item in rail.items.slice(0, 12)" :key="item.tmdb_id">
                            <div class="movie-card"
                                 :data-tmdb-id="item.tmdb_id"
                                 :data-content-type="rail.content_type"
                                 @click="navigateTo(item, rail.content_type)">
                                <div class="poster-container">
                                    <img :src="posterUrl(item.poster_path)" :alt="getTitle(item, rail.content_type)" loading="lazy">
                                    <span class="rating-badge" x-text="(item.vote_average || 0).toFixed(1)"></span>
                                </div>
                                <div class="card-info">
                                    <span class="card-title" x-text="getTitle(item, rail.content_type)"></span>
                                    <span class="card-status" x-text="getYear(item, rail.content_type) || (rail.content_type === 'series' ? 'Series' : 'Movie')"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                    <button class="rail-arrow rail-arrow-right" :class="{ 'rail-arrow-visible': canScrollRight }" @click="scrollRight()" type="button" aria-label="Scroll right">
                        <span class="rail-arrow-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
                    </button>
                </div>
            </div>
        </section>
    </template>

    <!-- Final CTA -->
    <section class="nf-final-cta" x-show="!$store.auth.isLoggedIn" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
        <h2>Ready to watch?</h2>
        <p>Choose your first story and start streaming in minutes.</p>
        <button class="btn btn-primary" type="button" @click="switchPage('register')">Create Your Account</button>
    </section>
</div>
