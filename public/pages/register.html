<div id="page-register" class="page-content active login-page">
    <nav class="auth-nav">
        <div class="logo auth-logo">
            <span class="logo-text">Voz</span><span class="logo-text">Flix</span>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card auth-card-rich">
            <p class="auth-kicker">Start Your Trial</p>
            <h1 class="auth-title">Create a VozFlix Account</h1>
            <p class="auth-helper">No commitments today. Cancel anytime with one click.</p>

            <form class="auth-form" id="register-form" x-data="registerForm" @submit.prevent="submit">
                <p x-show="error" x-text="error" style="color: #ff6b6b; font-size: 13px; margin-bottom: 8px;"></p>
                <div class="auth-input-group">
                    <input type="email" id="register-email" placeholder="Email" autocomplete="email" required x-model="email">
                </div>
                <div class="auth-input-group">
                    <input type="password" id="register-password" placeholder="Password" autocomplete="new-password" required minlength="8" x-model="password">
                </div>
                <div class="auth-input-group">
                    <input type="password" id="register-confirm" placeholder="Confirm password" autocomplete="new-password" required x-model="confirm">
                </div>
                <button type="submit" class="auth-btn" id="btn-register-continue" :disabled="loading" x-text="loading ? 'Creating account...' : 'Create account'"></button>
            </form>

            <div class="auth-switch">
                <p>Already a member? <a href="#login" id="link-to-login" @click.prevent="switchPage('login')">Sign in</a></p>
            </div>
        </div>
    </div>
</div>
