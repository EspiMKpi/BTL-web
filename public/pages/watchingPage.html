<div id="page-watching" class="page-content" x-data="watchingPage">
    <div x-show="loading" role="status" style="text-align:center; padding: 60px 20px; color: rgba(255,255,255,0.5);">
        Loading player…
    </div>

    <div x-show="error && !loading" role="alert" style="text-align:center; padding: 40px 20px;">
        <p style="color: #ff6b6b; margin-bottom: 16px;" x-text="error"></p>
        <button class="btn btn-secondary" type="button" @click="retry()">Try Again</button>
    </div>

    <section class="player-section" x-show="!loading && content">
        <div class="video-player-container player-container" style="background:#000; border-radius: var(--radius-sm); overflow:hidden; position:relative;">
            <iframe
                id="embed-player"
                :src="playerSrc"
                width="100%"
                height="100%"
                frameborder="0"
                allowfullscreen
                allow="autoplay; fullscreen; picture-in-picture"
                style="display:block; width:100%; height:100%; border:none;"
                referrerpolicy="no-referrer"></iframe>
            <!-- Click shield: absorbs first click per load to block ad popups -->
            <div class="click-shield"
                 x-data="{ show: true }"
                 x-show="show"
                 @click="show = false"
                 @content-loaded.window="show = true"
                 style="position:absolute; inset:0; z-index:10; cursor:pointer; background:transparent;">
            </div>
        </div>

        <!-- Server selector -->
        <div class="provider-selector">
            <span class="provider-label">Server:</span>
            <template x-for="(p, key) in providers" :key="key">
                <button class="provider-btn"
                        :class="{ active: activeProvider === key }"
                        @click="switchProvider(key)"
                        x-text="p.name">
                </button>
            </template>
        </div>

        <div class="player-metadata">
            <h1 class="player-title" x-text="title">Now Playing</h1>
            <div class="detail-meta-row">
                <span class="rating" x-text="'★ ' + rating"></span>
                <span x-text="metaLine"></span>
                <span>4K HDR · Atmos</span>
            </div>
            <p class="detail-desc" x-text="description"></p>
        </div>
    </section>

    <section class="watching-next-up up-next-section" x-show="!loading && upNext.length > 0">
        <div class="section-header">
            <h2 class="section-title">Episodes</h2>
            <button class="btn btn-primary btn-sm" type="button" @click="switchPage('detail', { contentId: content?.tmdb_id, contentType })">Back to details</button>
        </div>
        <!-- Season tabs -->
        <div class="season-tabs" x-show="content?.seasons?.length > 1">
            <template x-for="(season, idx) in (content?.seasons || [])" :key="season.season_number">
                <button class="season-tab"
                        :class="{ active: selectedSeasonIndex === idx }"
                        @click="selectSeason(idx)"
                        x-text="'Season ' + season.season_number"></button>
            </template>
        </div>
        <div class="episode-grid">
            <template x-for="ep in visibleEpisodes" :key="ep.episode_number">
                <div class="episode-card" role="button" tabindex="0"
                     :aria-label="'Play ' + (ep.name || ('Episode ' + ep.episode_number))"
                     :class="{ 'current-episode': selectedEpisode && ep.episode_number === selectedEpisode.episode_number }"
                     @click.stop="selectEpisode(ep)">
                    <div class="ep-thumbnail">
                        <img :src="episodeThumb(ep)" :alt="ep.name || ('Episode ' + ep.episode_number)">
                        <div class="ep-number" x-text="ep.episode_number"></div>
                    </div>
                    <div class="ep-info">
                        <h3 x-text="ep.name || ('Episode ' + ep.episode_number)"></h3>
                        <p x-text="ep.overview || 'No description available.'"></p>
                    </div>
                </div>
            </template>
        </div>
        <div class="episodes-toggle-wrap" x-show="hasMoreEpisodes">
            <button class="btn btn-secondary episodes-toggle-btn" @click="showAllEpisodes = !showAllEpisodes">
                <span x-text="showAllEpisodes ? 'Show Less' : 'Show All ' + upNext.length + ' Episodes'"></span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                     :style="showAllEpisodes ? 'transform: rotate(180deg)' : ''" style="transition: transform 0.25s ease;">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>
        </div>
    </section>
</div>
