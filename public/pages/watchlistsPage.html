<div id="page-watchlists" class="page-content" x-data="watchlistPage">
    <div class="watchlist-layout">
        <div class="user-main-card watchlist-hero-card">
            <div class="user-main-header">
                <div class="avatar-large">
                    <img :src="$store.auth.user?.avatar || 'https://i.pravatar.cc/150?u=' + ($store.auth.user?.email || 'user')" alt="Avatar">
                </div>
                <div class="user-main-info">
                    <h2 x-text="$store.auth.user?.username || $store.auth.user?.email || 'My Profile'">My Profile</h2>
                    <p x-text="$store.auth.user?.email || ''"></p>
                </div>
            </div>
            <div class="user-main-stats">
                <div class="main-stat">
                    <span class="stat-num" x-text="items.filter(i => i.status === 'completed').length">0</span>
                    <span class="stat-txt">Watched</span>
                </div>
                <div class="stat-divider"></div>
                <div class="main-stat">
                    <span class="stat-num" x-text="items.filter(i => i.status === 'plan_to_watch').length">0</span>
                    <span class="stat-txt">Watchlist</span>
                </div>
                <div class="stat-divider"></div>
                <div class="main-stat">
                    <span class="stat-num" x-text="items.length">0</span>
                    <span class="stat-txt">Total Saved</span>
                </div>
                <div class="stat-divider"></div>
                <div class="main-stat">
                    <span class="stat-num" x-text="items.filter(i => i.is_favorite).length">0</span>
                    <span class="stat-txt">Favorites</span>
                </div>
            </div>
        </div>

        <div class="watchlist-container">
            <div class="section-header">
                <h2 class="section-title">My Collections</h2>
                <a class="see-all" href="#" @click.prevent="window.switchPage('movies')">Browse more titles</a>
            </div>

            <div class="list-tabs">
                <button class="list-tab" :class="{ active: activeFilter === 'continue' }" @click="activeFilter = 'continue'" data-filter="continue">Continue Watching</button>
                <button class="list-tab" :class="{ active: activeFilter === 'watchlist' }" @click="activeFilter = 'watchlist'" data-filter="watchlist">Watchlist</button>
                <button class="list-tab" :class="{ active: activeFilter === 'completed' }" @click="activeFilter = 'completed'" data-filter="completed">Completed</button>
                <button class="list-tab" :class="{ active: activeFilter === 'favorites' }" @click="activeFilter = 'favorites'" data-filter="favorites">Favorites</button>
                <button class="list-tab" :class="{ active: activeFilter === 'all' }" @click="activeFilter = 'all'" data-filter="all">All</button>
            </div>

            <!-- Loading -->
            <div x-show="loading" role="status" style="text-align:center; padding:60px; color:rgba(255,255,255,0.5);">Loading watchlist...</div>
            <!-- Error -->
            <div x-show="error && !loading" role="alert" style="text-align:center; padding:40px;">
                <p style="color:#ff6b6b; margin-bottom:16px;" x-text="error"></p>
                <button class="btn btn-secondary" type="button" @click="retry()">Try Again</button>
            </div>

            <div class="movie-grid watchlist-grid" x-show="!loading">
                <template x-for="item in filteredItems" :key="item._id || item.tmdb_id">
                    <div class="movie-card" role="button" tabindex="0" :aria-label="item._title || 'Title'" @click="navigateTo(item)">
                        <div class="poster-container">
                            <img :src="item._poster || 'https://placehold.co/300x450/1a1a2e/white?text=No+Image'" :alt="item._title" loading="lazy">
                            <span class="rating-badge" x-text="item._rating ? item._rating.toFixed(1) : 'N/A'"></span>
                            <!-- Progress bar for continue-watching items -->
                            <template x-if="activeFilter === 'continue' && item.progress_seconds > 0">
                                <div class="progress-overlay">
                                    <div class="progress-bar">
                                        <div class="progress-fill" :style="'width:' + getProgressPercent(item) + '%'"></div>
                                    </div>
                                    <span class="progress-label" x-text="getProgressLabel(item)"></span>
                                </div>
                            </template>
                            <!-- Favorite toggle (top-right) — only for watchlist items -->
                            <template x-if="activeFilter !== 'continue'">
                                <div class="bookmark-btn" style="left: auto; right: 8px;" :style="item.is_favorite ? 'left:auto;right:8px;color:var(--accent-red,#ff5d6c);opacity:1;transform:scale(1);' : 'left:auto;right:8px;'" @click.stop="toggleFavorite(item)" title="Favorite">
                                    <div class="icon-wrapper" style="width: 14px; height: 14px;">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" :fill="item.is_favorite ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                    </div>
                                </div>
                            </template>
                            <!-- Bookmark/remove (top-left) — only for watchlist items -->
                            <template x-if="activeFilter !== 'continue'">
                                <div class="bookmark-btn" @click.stop="remove(item)" title="Remove from list">
                                    <div class="icon-wrapper" style="width: 14px; height: 14px;">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                                    </div>
                                </div>
                            </template>
                        </div>
                        <div class="card-info">
                            <span class="card-title" x-text="item._title || 'Unknown'"></span>
                            <span class="card-status" x-show="activeFilter !== 'continue'" x-text="statusLabel(item)"></span>
                            <span class="card-status" x-show="activeFilter === 'continue'" x-text="item.season_number ? 'S' + item.season_number + ' E' + (item.episode_number || '?') : 'Continue watching'"></span>
                        </div>
                    </div>
                </template>
                <div x-show="!loading && filteredItems.length === 0" style="grid-column:1/-1; color:rgba(255,255,255,0.4); padding:40px; text-align:center; white-space:nowrap;">
                    Nothing here yet. <span style="cursor:pointer; color:var(--accent-gold);" @click="window.switchPage('movies')">Browse titles →</span>
                </div>
            </div>
        </div>
    </div>
</div>
