<div id="page-login" class="page-content login-page">
    <nav class="auth-nav">
        <div class="logo auth-logo">
            <span class="logo-text">Voz</span><span class="logo-text">Flix</span>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card auth-card-rich">
            <p class="auth-kicker">Welcome Back</p>
            <h1 class="auth-title">Sign In to Continue</h1>
            <p class="auth-helper">Pick up where you left off and keep your watch history in sync.</p>

            <form class="auth-form" id="login-form" x-data="loginForm" @submit.prevent="submit">
                <p x-show="error" x-text="error" class="auth-error" style="color: #ff6b6b; font-size: 13px; margin-bottom: 8px;"></p>
                <div class="auth-input-group">
                    <input type="email" id="login-email" placeholder="Email" autocomplete="email" required x-model="email">
                </div>
                <div class="auth-input-group">
                    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required x-model="password">
                </div>
                <button type="submit" class="auth-btn" id="btn-login-continue" :disabled="loading" x-text="loading ? 'Signing in...' : 'Continue'"></button>
            </form>

            <div class="auth-switch">
                <p>New to VozFlix? <a href="#register" id="link-to-register" @click.prevent="switchPage('register')">Create account</a></p>
            </div>
        </div>
    </div>
</div>
