<div id="page-watching" class="page-content" x-data="watchingPage">
    <div x-show="loading" style="text-align:center; padding: 60px 20px; color: rgba(255,255,255,0.5);">
        Loading player…
    </div>

    <div x-show="error" x-text="error" style="text-align:center; padding: 40px 20px; color: #ff6b6b;"></div>

    <section class="player-section" x-show="!loading && content">
        <div class="video-player-container" style="background:#000; border-radius: var(--radius-sm); overflow:hidden; position:relative;">
            <iframe
                id="embed-player"
                :src="playerSrc"
                width="100%"
                height="100%"
                frameborder="0"
                allowfullscreen
                allow="autoplay; fullscreen; picture-in-picture"
                style="display:block; width:100%; height:100%; border:none;"
                referrerpolicy="no-referrer"></iframe>
            <!-- Click shield: absorbs first click per load to block ad popups -->
            <div class="click-shield"
                 x-data="{ show: true }"
                 x-show="show"
                 @click="show = false"
                 @content-loaded.window="show = true"
                 style="position:absolute; inset:0; z-index:10; cursor:pointer; background:transparent;">
            </div>
        </div>

        <!-- Server selector -->
        <div class="provider-selector">
            <span class="provider-label">Server:</span>
            <template x-for="(p, key) in providers" :key="key">
                <button class="provider-btn"
                        :class="{ active: activeProvider === key }"
                        @click="switchProvider(key)"
                        x-text="p.name">
                </button>
            </template>
        </div>

        <div class="player-metadata">
            <h1 class="player-title" x-text="title">Now Playing</h1>
            <div class="detail-meta-row">
                <span class="rating" x-text="'★ ' + rating"></span>
                <span x-text="metaLine"></span>
                <span>4K HDR · Atmos</span>
            </div>
            <p class="detail-desc" x-text="description"></p>
        </div>
    </section>

    <section class="watching-next-up" x-show="!loading && upNext.length > 0">
        <div class="section-header">
            <h2 class="section-title">Up Next</h2>
            <button class="see-all" type="button" @click="switchPage('detail')">Back to details</button>
        </div>
        <div class="episode-grid">
            <template x-for="ep in upNext" :key="ep.episode_number">
                <div class="episode-card" @click.stop="selectEpisode(ep)">
                    <div class="ep-thumbnail">
                        <img :src="episodeThumb(ep)" :alt="ep.name || ('Episode ' + ep.episode_number)">
                        <div class="ep-number" x-text="ep.episode_number"></div>
                    </div>
                    <div class="ep-info">
                        <h3 x-text="ep.name || ('Episode ' + ep.episode_number)"></h3>
                        <p x-text="ep.overview || 'No description available.'"></p>
                    </div>
                </div>
            </template>
        </div>
    </section>
</div>
