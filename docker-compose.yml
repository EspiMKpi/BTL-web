version: '3.8'

services:
  vozflix-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vozflix-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=movie_db
      - DB_USER=root
      - DB_PASSWORD=vozflix_db_pass
      - JPA_DDL_AUTO=update
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_BASE_URL=https://api.themoviedb.org/3
      - TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p
      - SEARCH_CACHE_TTL=3600
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vozflix-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:8.4
    container_name: vozflix-mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=vozflix_db_pass
      - MYSQL_DATABASE=movie_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pvozflix_db_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vozflix-network

  redis:
    image: redis:7-alpine
    container_name: vozflix-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vozflix-network

volumes:
  mysql-data:
  redis-data:

networks:
  vozflix-network:
    driver: bridge