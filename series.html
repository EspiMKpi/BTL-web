<!DOCTYPE html>

<head>

    <title>CineDrop | Series</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <div class="app-container">
        <nav class="nav-bar" id="main-nav">
            <div class="logo">
                <span class="logo-text">Cine</span><span class="logo-text">Drop</span>
            </div>
            <div class="nav-links">
                <a href="discover.html" class="nav-link" data-page="discover">Discover</a>
                <a href="movies.html" class="nav-link" data-page="movies">Movies</a>
                <a href="series.html" class="nav-link active" data-page="series">Series</a>
                <a href="watchlists.html" class="nav-link" data-page="watchlists">Watchlists</a>
            </div>
            <div class="search-box hide-mobile">
                <div class="icon-wrapper" style="width: 14px; height: 14px; flex-shrink: 0; color: rgba(255,255,255,0.3);">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </div>
                <input type="text" placeholder="Search films, series...">
            </div>

            <button class="mobile-menu-btn" id="mobile-menu-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>

            <div class="avatar-wrapper" style="flex-shrink: 0; position: relative;">
                <div class="avatar" id="avatar-toggle">
                    <img src="https://i.pravatar.cc/150?u=marcuslee" alt="User Avatar" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px;">
                </div>

                <div class="profile-dropdown" id="profile-dropdown">
                    <div class="dropdown-header">
                        <p class="dropdown-name">Marcus Lee</p>
                        <p class="dropdown-handle">@marcuslee</p>
                    </div>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item">Profile</a>
                    <a href="#" class="dropdown-item">Settings</a>
                    <div class="dropdown-divider"></div>
                    <a href="auth-login.html" class="dropdown-item logout" id="logout-btn">
                        <div class="icon-wrapper" style="width: 16px; height: 16px; color: currentColor;">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        </div>
                        Logout
                    </a>
                </div>
            </div>
        </nav>

        <main class="main-layout">
            <div id="page-series" class="page-content active">
                <div class="section-header">
                    <h2 class="section-title">New Series</h2>
                </div>
                <div class="movie-grid">
                    <div class="movie-card"><div class="poster-container"><img src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=600&auto=format&fit=crop" alt="Series 1"><span class="rating-badge">9.0</span><div class="bookmark-btn"><div class="icon-wrapper" style="width: 14px; height: 14px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></div></div></div><div class="card-info"><span class="card-title">Tide Break</span><span class="card-status">Series - 2024</span></div></div>
                    <div class="movie-card"><div class="poster-container"><img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=600&auto=format&fit=crop" alt="Series 2"><span class="rating-badge">8.5</span><div class="bookmark-btn"><div class="icon-wrapper" style="width: 14px; height: 14px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></div></div></div><div class="card-info"><span class="card-title">Neon Dreams</span><span class="card-status">Series - 2023</span></div></div>
                </div>
            </div>
        </main>

        <footer class="main-footer">

            <div class="footer-content">
                <div class="logo">
                    <span class="logo-text">Cine</span><span class="logo-text">Drop</span>
                </div>
                <div class="footer-links">
                    <a href="javascript:void(0)">About</a>
                    <a href="javascript:void(0)">Contact</a>
                    <a href="javascript:void(0)">Privacy Policy</a>
                    <a href="javascript:void(0)">Terms of Service</a>
                </div>
                <div class="copyright">┬⌐ 2024 CineDrop. All rights reserved.</div>
            </div>
        </footer>
    </div>
    <script src="assets/js/router.js"></script>
    <script src="assets/js/actions.js"></script>
    <script src="assets/js/main.js"></script>

</html>
