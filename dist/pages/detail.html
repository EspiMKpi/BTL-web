<div id="page-detail" class="page-content" x-data="detailPage()" x-init="init()">
    <!-- Loading state -->
    <template x-if="$store.detail.loading">
        <div style="text-align:center; padding: 100px 0;">
            <p style="color: rgba(255,255,255,0.5); font-size: 16px;">Loading details...</p>
        </div>
    </template>

    <!-- Error state -->
    <template x-if="$store.detail.error && !$store.detail.loading">
        <div style="text-align:center; padding: 100px 0;">
            <p style="color: #ff6b6b; font-size: 16px;" x-text="$store.detail.error"></p>
            <a href="#discover" class="btn btn-primary" style="margin-top: 20px;">Back to Discover</a>
        </div>
    </template>

    <!-- Dynamic content -->
    <template x-if="$store.detail.item && !$store.detail.loading">
        <div>
            <section class="detail-hero">
                <div class="detail-hero-poster">
                    <img :src="$store.detail.backdropSrc" :alt="$store.detail.title">
                </div>

                <div class="detail-hero-scrim"></div>
                <div class="detail-hero-content">
                    <p class="landing-eyebrow" x-text="$store.detail.type === 'series' ? 'TV Series' : 'Movie'"></p>
                    <h1 class="detail-title" x-text="$store.detail.title"></h1>
                    <div class="detail-meta-row">
                        <span class="rating">★ <span x-text="$store.detail.voteAverage"></span></span>
                        <span x-text="$store.detail.year"></span>
                        <span x-text="$store.detail.runtime"></span>
                        <span x-text="$store.detail.genresStr"></span>
                    </div>
                    <p class="detail-desc" x-text="$store.detail.overview"></p>
                    <div class="detail-cta-row">
                        <button class="btn btn-primary" id="btn-watch-now">
                            <div class="icon-wrapper" style="width: 18px; height: 18px; color: black;">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="m7 3 14 9-14 9V3z"/></svg>
                            </div>
                            Watch Now
                        </button>
                        <button class="btn btn-secondary" @click="toggleWatchlist()">
                            <div class="icon-wrapper" style="width: 18px; height: 18px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></div>
                            <span x-text="inWatchlist ? 'In Watchlist' : 'Add to List'"></span>
                        </button>
                        <template x-if="$store.detail.type === 'series'">
                            <button class="btn btn-secondary" @click="showEpisodes = !showEpisodes">
                                <div class="icon-wrapper" style="width: 18px; height: 18px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></div>
                                View Episodes
                            </button>
                        </template>
                    </div>
                </div>
            </section>

            <section class="detail-info-grid">
                <article class="detail-info-card">
                    <p class="sidebar-label">Synopsis</p>
                    <p x-text="$store.detail.overview || 'No synopsis available.'"></p>
                </article>
                <article class="detail-info-card" x-show="$store.detail.castList.length > 0">
                    <p class="sidebar-label">Cast</p>
                    <p x-text="$store.detail.castList.map(c => c.name).join(' · ')"></p>
                </article>
                <article class="detail-info-card" x-show="$store.detail.director">
                    <p class="sidebar-label">Director</p>
                    <p x-text="$store.detail.director"></p>
                </article>
                <article class="detail-info-card">
                    <p class="sidebar-label">Details</p>
                    <p>
                        <span x-show="$store.detail.item.status" x-text="$store.detail.item.status"></span>
                        <span x-show="$store.detail.item.original_language"> · Language: <span x-text="$store.detail.item.original_language?.toUpperCase()"></span></span>
                        <span x-show="$store.detail.item.vote_count"> · <span x-text="$store.detail.item.vote_count"></span> votes</span>
                    </p>
                </article>
            </section>

            <!-- Seasons/Episodes (series only) -->
            <template x-if="$store.detail.type === 'series' && $store.detail.seasons.length > 0 && showEpisodes">
                <section class="episode-section">
                    <div class="section-header">
                        <h2 class="section-title">Episodes</h2>
                        <a href="#watching" class="see-all">Open Player</a>
                    </div>
                    <div class="season-tabs">
                        <template x-for="season in $store.detail.seasons" :key="season.season_number">
                            <button class="season-tab" :class="{'active': activeSeason === season.season_number}" @click="activeSeason = season.season_number" x-text="'Season ' + season.season_number"></button>
                        </template>
                    </div>
                    <div class="episode-grid">
                        <template x-for="season in $store.detail.seasons.filter(s => s.season_number === activeSeason)" :key="season.season_number">
                            <template x-for="ep in season.episodes" :key="ep.episode_number">
                                <div class="episode-card">
                                    <div class="ep-thumbnail">
                                        <img :src="ep.still_path ? 'https://image.tmdb.org/t/p/w300' + ep.still_path : 'https://via.placeholder.com/300x170?text=Ep+' + ep.episode_number" :alt="ep.name" loading="lazy">
                                        <div class="ep-number" x-text="ep.episode_number"></div>
                                    </div>
                                    <div class="ep-info">
                                        <h3 x-text="ep.name || ('Episode ' + ep.episode_number)"></h3>
                                        <p x-text="ep.overview || 'No description available.'"></p>
                                    </div>
                                </div>
                            </template>
                        </template>
                    </div>
                </section>
            </template>
        </div>
    </template>

    <!-- Fallback static content -->
    <template x-if="!$store.detail.item && !$store.detail.loading && !$store.detail.error">
        <div>
            <section class="detail-hero">
                <div class="detail-hero-poster">
                    <img src="https://images.unsplash.com/photo-1510827220565-c6a086ff31c8?q=80&w=1920&auto=format&fit=crop" alt="Glass Kingdom key art">
                </div>
                <div class="detail-hero-scrim"></div>
                <div class="detail-hero-content">
                    <p class="landing-eyebrow">VozFlix Original</p>
                    <h1 class="detail-title">Glass Kingdom</h1>
                    <div class="detail-meta-row">
                        <span class="rating">★ 8.9</span><span>2026</span><span>2h 11m</span><span>Thriller, Sci-fi, Mystery</span>
                    </div>
                    <p class="detail-desc">In a city suspended over a dead ocean, an architect uncovers an algorithm that can rewrite memory itself.</p>
                    <div class="detail-cta-row">
                        <button class="btn btn-primary" id="btn-watch-now">
                            <div class="icon-wrapper" style="width: 18px; height: 18px; color: black;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="m7 3 14 9-14 9V3z"/></svg></div>
                            Watch Now
                        </button>
                        <button class="btn btn-secondary">
                            <div class="icon-wrapper" style="width: 18px; height: 18px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></div>
                            Add to List
                        </button>
                    </div>
                </div>
            </section>
            <section class="detail-info-grid">
                <article class="detail-info-card"><p class="sidebar-label">Synopsis</p><p>A whistleblower leaks proof that Glass Kingdom's citizens are living edited lives.</p></article>
                <article class="detail-info-card"><p class="sidebar-label">Cast</p><p>Nina Zhao · Mateo Rios · Kareem Voss · Anya Takahashi</p></article>
            </section>
        </div>
    </template>
</div>
