<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VozFlix | Stream Movies & Series</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/preloader.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Cinematic Preloader -->
    <div id="preloader">
        <div class="preloader-glow"></div>
        <div class="preloader-text">
            <span class="preloader-letter">V</span>
            <span class="preloader-letter">O</span>
            <span class="preloader-letter gold">Z</span>
            <span class="preloader-letter">F</span>
            <span class="preloader-letter">L</span>
            <span class="preloader-letter">I</span>
            <span class="preloader-letter gold">X</span>
        </div>
        <div class="preloader-bar-track">
            <div class="preloader-bar"></div>
        </div>
        <p class="preloader-tagline">Streaming Cinema</p>
    </div>

    <div class="app-container" x-data="appState">
        <!-- Navigation -->
        <nav class="nav-bar hide" id="main-nav">
            <a href="#discover" class="logo" @click.prevent="window.switchPage('discover')">
                <span class="logo-text">Voz</span><span class="logo-text">Flix</span>
            </a>
            <div class="nav-links">
                <a href="#discover" class="nav-link active" data-page="discover">Discover</a>
                <a href="#movies" class="nav-link" data-page="movies">Movies</a>
                <a href="#series" class="nav-link" data-page="series">Series</a>
                <a href="#watchlists" class="nav-link" data-page="watchlists">Watchlists</a>
                <a href="#admin" class="nav-link admin-link" data-page="admin" x-show="$store.auth.user?.role === 'admin'" style="color: var(--accent-gold); font-weight: 700;">Admin</a>
            </div>
            <div class="search-wrapper hide-mobile" x-data="navSearch" @click.outside="close()">
                <div class="search-box">
                    <div class="icon-wrapper" style="width: 14px; height: 14px; flex-shrink: 0; color: rgba(255,255,255,0.3);">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    </div>
                    <input type="text" placeholder="Search films, series..."
                           x-model="query"
                           @input="onInput()"
                           @focus="if (results.length > 0 || query.trim().length >= 2) open = true"
                           @keydown.enter="submit(); $event.target.blur()"
                           @keydown.escape="close(); $event.target.blur()">
                </div>
                <div class="search-dropdown" x-show="open" x-cloak x-transition.opacity.duration.150ms>
                    <template x-if="loading">
                        <div class="search-dropdown-status">Searching&hellip;</div>
                    </template>
                    <template x-if="!loading && results.length === 0 && query.trim().length >= 2">
                        <div class="search-dropdown-status">
                            No results for &ldquo;<span x-text="query.trim()"></span>&rdquo;
                        </div>
                    </template>
                    <template x-for="item in results" :key="item.content_type + '-' + item.tmdb_id">
                        <a href="#" class="search-dropdown-item" @click.prevent="goToResult(item)">
                            <img :src="posterUrl(item.poster_path)" alt="" class="search-dropdown-poster" loading="lazy">
                            <div class="search-dropdown-meta">
                                <div class="search-dropdown-title" x-text="getTitle(item)"></div>
                                <div class="search-dropdown-sub">
                                    <span x-text="item.content_type === 'series' ? 'Series' : 'Movie'"></span>
                                    <template x-if="getYear(item)">
                                        <span> &middot; <span x-text="getYear(item)"></span></span>
                                    </template>
                                </div>
                            </div>
                        </a>
                    </template>
                    <template x-if="!loading && results.length > 0">
                        <a href="#" class="search-dropdown-footer" @click.prevent="submit()">
                            See all results for &ldquo;<span x-text="query.trim()"></span>&rdquo;
                        </a>
                    </template>
                </div>
            </div>
            <button class="mobile-menu-btn" id="mobile-menu-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="avatar-wrapper" style="flex-shrink: 0; position: relative;" x-data="dropdown" @click.outside="close()">
                <div class="avatar" id="avatar-toggle" @click.stop="toggle()">
                    <img :src="$store.auth.user?.avatar_url || 'https://i.pravatar.cc/150?u=' + ($store.auth.user?.email || 'default')" alt="User Avatar" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px;">
                </div>
                <div class="profile-dropdown" id="profile-dropdown" :class="{'show': open}">
                    <div class="dropdown-header">
                        <p class="dropdown-name" x-text="$store.auth.user?.username || 'User'"></p>
                        <p class="dropdown-handle" x-text="'@' + ($store.auth.user?.username || 'user')"></p>
                    </div>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item" @click.prevent="close(); window.switchPage('profile')">Profile</a>
                    <a href="#" class="dropdown-item" @click.prevent="close(); window.switchPage('watchlists')">My Watchlists</a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item logout" @click.prevent="close(); $store.auth.logout(); window.switchPage('login')">
                        <div class="icon-wrapper" style="width: 16px; height: 16px; color: currentColor;">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        </div>
                        Logout
                    </a>
                </div>
            </div>
        </nav>

        <!-- Main Layout -->
        <main class="main-layout">
            <div id="page-host"></div>
        </main>

        <footer class="main-footer hide">
            <div class="footer-content">
                <div class="logo">
                    <span class="logo-text">Voz</span><span class="logo-text">Flix</span>
                </div>
                <div class="footer-links">
                    <a href="javascript:void(0)">About</a>
                    <a href="javascript:void(0)">Contact</a>
                    <a href="javascript:void(0)">Privacy Policy</a>
                    <a href="javascript:void(0)">Terms of Service</a>
                </div>
                <div class="copyright">© 2026 VozFlix. All rights reserved.</div>
            </div>
        </footer>

        <!-- Toast Notification (Alpine.js) -->
        <div x-data x-show="$store.toast.visible" x-text="$store.toast.message"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-4"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-4"
            style="position: fixed; bottom: 30px; right: 30px; background: var(--bg-elevated); color: var(--text-primary); padding: 12px 24px; border-radius: var(--radius-md); font-weight: 500; font-size: 14px; z-index: 2000; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); border: 1px solid var(--border-subtle); backdrop-filter: blur(12px);">
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
