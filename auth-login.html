<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineDrop | Log In</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <div class="app-container">
        <main class="main-layout">
            <div id="page-auth-login" class="page-content auth-page active">
                <div class="auth-nav-bar">
                    <a href="landing.html" class="logo">
                        <span class="logo-text">Cine</span><span class="logo-text">Drop</span>
                    </a>
                </div>
                <div class="auth-content-wrapper" style="background: linear-gradient(-58.2659deg, rgb(26, 16, 37) 21.693%, rgb(13, 26, 46) 50%, rgb(28, 14, 10) 78.307%);">
                    <div class="auth-form-container">
                        <h1 class="auth-title">Log in</h1>
                        <form class="auth-form" id="login-form" action="discover.html" method="GET">
                            <div class="auth-input-group">
                                <input type="text" placeholder="Email or mobile number" required>
                            </div>
                            <div class="auth-input-group">
                                <input type="password" placeholder="Password" required>
                            </div>
                            <button type="submit" class="btn btn-auth-primary">Login</button>
                            <p class="auth-divider-text">or sign in with</p>
                            <button type="button" class="btn btn-google">
                                <div class="google-icon-wrapper">
                                    <img src="http://localhost:3845/assets/e264adc0f54001c301ab30ad56920f3203487592.svg" alt="Google">
                                </div>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="assets/js/router.js"></script>
    <script src="assets/js/actions.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
