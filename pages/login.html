<div id="page-login" class="page-content active login-page">
    <nav class="auth-nav">
        <div class="logo auth-logo">
            <span class="logo-text">Voz</span><span class="logo-text">Flix</span>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card auth-card-rich">
            <p class="auth-kicker">Welcome Back</p>
            <h1 class="auth-title">Sign In to Continue</h1>
            <p class="auth-helper">Pick up where you left off and keep your watch history in sync.</p>

            <form class="auth-form" id="login-form" onsubmit="return false;">
                <div class="auth-input-group">
                    <input type="text" id="login-email" placeholder="Email or mobile number" autocomplete="email" required>
                </div>
                <div class="auth-input-group">
                    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="auth-btn" id="btn-login-continue">Continue</button>
            </form>

            <div class="auth-divider">
                <span>or sign in with</span>
            </div>

            <div class="auth-social">
                <button class="social-google" id="btn-google-login" aria-label="Sign in with Google">
                    <span>G</span>
                </button>
            </div>

            <div class="auth-switch">
                <p>New to VozFlix? <a href="#register" id="link-to-register">Create account</a></p>
            </div>
        </div>
    </div>
</div>
