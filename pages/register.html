<div id="page-register" class="page-content active login-page">
    <nav class="auth-nav">
        <div class="logo auth-logo">
            <span class="logo-text">Voz</span><span class="logo-text">Flix</span>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card auth-card-rich">
            <p class="auth-kicker">Start Your Trial</p>
            <h1 class="auth-title">Create a VozFlix Account</h1>
            <p class="auth-helper">No commitments today. Cancel anytime with one click.</p>

            <form class="auth-form" id="register-form" onsubmit="return false;">
                <div class="auth-input-group">
                    <input type="text" id="register-username" placeholder="Username" autocomplete="username" required>
                </div>
                <div class="auth-input-group">
                    <input type="text" id="register-email" placeholder="Email or mobile number" autocomplete="email" required>
                </div>
                <div class="auth-input-group">
                    <input type="password" id="register-password" placeholder="Password" autocomplete="new-password" required>
                </div>
                <div class="auth-input-group">
                    <input type="password" id="register-confirm" placeholder="Confirm password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="auth-btn" id="btn-register-continue">Create account</button>
            </form>

            <div class="auth-switch">
                <p>Already a member? <a href="#login" id="link-to-login">Sign in</a></p>
            </div>
        </div>
    </div>
</div>
