<div id="page-watchlists" class="page-content">
    <div class="watchlist-layout">
        <div class="user-main-card watchlist-hero-card" id="watchlist-hero">
            <div class="user-main-header">
                <div class="avatar-large" id="watchlist-avatar">
                    <img src="" alt="" id="watchlist-avatar-img" style="display:none;">
                </div>
                <div class="user-main-info">
                    <h2 id="watchlist-username">Guest</h2>
                    <p id="watchlist-handle">Sign in to manage your lists</p>
                </div>
            </div>
            <div class="user-main-stats" id="watchlist-stats">
                <div class="main-stat"><span class="stat-num" id="watchlist-count-all">0</span><span class="stat-txt">Total</span></div>
                <div class="stat-divider"></div>
                <div class="main-stat"><span class="stat-num" id="watchlist-count-continue">0</span><span class="stat-txt">Continue</span></div>
                <div class="stat-divider"></div>
                <div class="main-stat"><span class="stat-num" id="watchlist-count-wishlist">0</span><span class="stat-txt">Wishlist</span></div>
                <div class="stat-divider"></div>
                <div class="main-stat"><span class="stat-num" id="watchlist-count-completed">0</span><span class="stat-txt">Completed</span></div>
                <div class="stat-divider"></div>
                <div class="main-stat"><span class="stat-num" id="watchlist-count-favorites">0</span><span class="stat-txt">Favorites</span></div>
            </div>
        </div>

        <div class="watchlist-container">
            <div class="section-header">
                <h2 class="section-title">My Collections</h2>
                <a href="#movies" class="see-all">Browse more titles</a>
            </div>

            <div class="list-tabs">
                <button class="list-tab active" data-filter="continue">Continue Watching</button>
                <button class="list-tab" data-filter="wishlist">Wishlist</button>
                <button class="list-tab" data-filter="completed">Completed</button>
                <button class="list-tab" data-filter="favorites">Favorites</button>
                <button class="list-tab" data-filter="all">All</button>
                <button class="add-list-btn">+</button>
            </div>

            <div class="movie-grid watchlist-grid" id="watchlist-grid"></div>
        </div>
    </div>
</div>
