<div id="page-discover" class="page-content nf-landing">
    <section class="nf-hero" id="discover-hero">
        <img src="" alt="VozFlix hero backdrop" class="nf-hero-backdrop" id="discover-hero-backdrop" style="display:none;">
        <div class="nf-hero-scrim"></div>
        <div class="nf-hero-content">
            <p class="nf-kicker" id="discover-kicker">Loading...</p>
            <h1 class="nf-title" id="discover-title">VozFlix</h1>
            <p class="nf-copy" id="discover-copy">Fetching the latest content...</p>
            <div class="nf-email-row">
                <input type="email" class="nf-email-input" placeholder="Email address" aria-label="Email address">
                <button class="btn btn-primary" id="btn-watch-now">
                    <div class="icon-wrapper" style="width: 20px; height: 20px; color: currentColor;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="m7 3 14 9-14 9V3z"/></svg>
                    </div>
                    Start Watching
                </button>
            </div>
            <p class="nf-helper">Ready to watch? Start now and dive into your first title in seconds.</p>
        </div>
    </section>


    <section class="movie-section nf-content-section" id="discover-genres-section">
        <div class="section-header">
            <h2 class="section-title">Browse by Genre</h2>
        </div>
        <div class="discover-genre-chips" id="discover-genre-chips"></div>
        <div class="movie-grid nf-row-grid" id="discover-genre-results" style="display:none;"></div>
    </section>

    <section class="movie-section nf-content-section" id="discover-top10-section">
        <div class="section-header">
            <h2 class="section-title" id="discover-top10-title">Top 10 Today</h2>
            <a href="#movies" class="see-all">Browse full chart</a>
        </div>
        <div class="nf-top10-grid" id="discover-top10-grid"></div>
    </section>

    <section class="movie-section nf-content-section" id="discover-trending-section">
        <div class="section-header">
            <h2 class="section-title" id="discover-trending-title">Trending Now</h2>
            <a href="#movies" class="see-all">See all</a>
        </div>
        <div class="movie-grid nf-row-grid" id="discover-trending-grid"></div>
    </section>

    <section class="movie-section nf-content-section" id="discover-series-section">
        <div class="section-header">
            <h2 class="section-title" id="discover-series-title">Only on VozFlix</h2>
            <a href="#series" class="see-all">Original series</a>
        </div>
        <div class="movie-grid nf-row-grid" id="discover-series-grid"></div>
    </section>
</div>
