<div id="page-movies" class="page-content">
    <section class="catalog-hero" id="movies-hero">
        <div>
            <p class="landing-eyebrow">Movies</p>
            <h1 class="catalog-title" id="movies-catalog-title">Movies</h1>
            <p class="catalog-copy" id="movies-catalog-copy">Browse the full movie catalog.</p>
        </div>
        <div class="catalog-hero-metrics">
            <div class="catalog-metric" id="movies-metric-rating">
                <span>-</span>
                <p>Top Rating</p>
            </div>
            <div class="catalog-metric" id="movies-metric-count">
                <span>-</span>
                <p>Total Movies</p>
            </div>
        </div>
    </section>

    <div class="filter-bar">
        <button class="btn-filter" id="filter-dropdown-toggle">
            <div class="icon-wrapper" style="width: 18px; height: 18px; color: white;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
            </div>
            <span>Filters</span>
        </button>

        <div class="filter-search">
            <input type="text" placeholder="Search title, director, or keyword" id="movies-search-input">
            <div class="icon-wrapper" style="width: 14px; height: 14px; color: rgba(255,255,255,0.3);">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
        </div>

        <button class="btn btn-primary" style="height: 40px; border-radius: 12px;" id="movies-search-btn">
            <div class="icon-wrapper" style="width: 18px; height: 18px; color: black;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
            Search
        </button>
    </div>

    <div class="filter-panel" id="filter-panel">
        <div class="filter-group" data-filter-group="year">
            <h3>Year</h3>
            <div id="movies-filter-years"></div>
        </div>
        <div class="filter-group" data-filter-group="genre">
            <h3>Genre</h3>
            <div id="movies-filter-genres"></div>
        </div>
    </div>

    <section class="movie-section catalog-main-grid">
        <div class="section-header">
            <h2 class="section-title" id="movies-section-title">Now on VozFlix</h2>
        </div>
        <div class="movie-grid" id="search-results-grid"></div>
    </section>
</div>
